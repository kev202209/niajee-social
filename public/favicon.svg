<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" style="background-color: #001f3f;">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="50%" x2="100%" y2="50%" spreadMethod="reflect">
      <stop offset="0%" stop-color="#4F46E5">
        <animate attributeName="offset" from="0" to="1" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="20%" stop-color="#818CF8">
        <animate attributeName="offset" from="0.2" to="1.2" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="40%" stop-color="#38BDF8">
        <animate attributeName="offset" from="0.4" to="1.4" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#D946EF">
        <animate attributeName="offset" from="0.6" to="1.6" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="80%" stop-color="#38BDF8">
        <animate attributeName="offset" from="0.8" to="1.8" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818CF8">
        <animate attributeName="offset" from="1" to="2" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <text
    x="50%"
    y="50%"
    font-size="50"
    font-family="Arial, sans-serif"
    font-weight="bold"
    fill="url(#gradient)"
    text-anchor="middle"
    dominant-baseline="middle"
  >
    M
  </text>
</svg>